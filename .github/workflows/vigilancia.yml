# =============================================================================
#  Vigilancia: ¿responde el sitio y hay algún medio caído?
# =============================================================================
#  Cierra dos de los tres puntos de la Fase C de la auditoría. El tercero —el
#  desfase de despliegue— va aparte en `desfase.yml`, porque su cadencia y su
#  arreglo son distintos.
#
#  QUÉ COMPRUEBA
#    · Que doblefoco.co y la API responden 200, y que la API no se declara
#      «degradado» (lo hace sola cuando la ingesta lleva demasiado sin correr).
#    · Que ningún medio con feed lleva 14 días o más sin aportar un artículo.
#    · Que la copia de seguridad diaria se hizo — y esta es distinta de las
#      otras dos: comprueba que algo OCURRIÓ, no que algo salió bien. Ver abajo.
#
#  CÓMO AVISA, Y POR QUÉ NO BASTA CON FALLAR
#
#  Detectar y avisar no son lo mismo, y esto costó una caída aprenderlo. El
#  2026-08-11 el motor de ingesta llevaba diez horas muerto; esta vigilancia lo
#  detectó a la primera —«API responde HTTP 503»— y falló en rojo a las 06:53.
#  Nadie se enteró: un aspa roja en la pestaña de Actions no la ve quien no está
#  mirando, y el correo automático de GitHub se pierde entre los demás.
#
#  Así que al fallar se ABRE UN ISSUE, y al recuperarse se CIERRA SOLO. Un issue
#  es persistente —sigue ahí mañana—, notificable, y no necesita ningún servicio
#  externo ni ningún secreto nuevo que rotar.
#
#  UNO SOLO A LA VEZ. Si ya hay uno abierto se le añade un comentario en vez de
#  abrir otro: cuatro comprobaciones al día durante un fin de semana serían ocho
#  issues del mismo incidente, y un aviso que se repite deja de leerse. Es el
#  mismo motivo por el que se cierra solo — un tablero lleno de avisos viejos ya
#  resueltos entrena a ignorarlo.
#
#  LO QUE ESTO NO ES, Y CONVIENE NO CONFUNDIRLO
#
#  Desde el 2026-08-19 corre además `invariantes.mjs`, que no pregunta si el
#  sitio está en pie sino si lo que dice PUEDE ser cierto. Son cosas distintas y
#  ese día se vio por qué: el sitio estaba perfectamente en pie sirviendo 4 050
#  historias sin tema y un catálogo entero marcado como nacional.
#
#  Y desde el 2026-08-31 hay una tercera clase de comprobación, que no se parece
#  a ninguna de las dos: **los fallos por NO ocurrir**. Un flujo que se ejecuta y
#  sale mal deja un aspa roja; uno que deja de ejecutarse no deja nada, y por eso
#  es el más difícil de ver. Se añadió aquí porque la copia de seguridad estuvo
#  trece días rota sin que nadie lo notara, y al arreglarla quedó claro que el
#  aviso nuevo cubría el fallo pero no la ausencia. Lo natural sería que cada
#  flujo se vigilara a sí mismo, y es justo lo que no puede hacer: si no corre,
#  no corre nada suyo. Tiene que mirarlo alguien de fuera.
#
#  No es un monitor de disponibilidad. Corre cada 6 horas y el cron de GitHub se
#  retrasa, así que una caída de una hora puede pasar desapercibida. Para eso
#  hace falta un servicio de monitoreo de verdad, con sondeo por minuto y aviso
#  inmediato. Esto detecta lo que hoy no se ve en absoluto: que algo lleve roto
#  desde ayer. Decirlo importa, porque una comprobación cada 6 horas con nombre
#  de «vigilancia» invita a creer que hay una red que no existe.
#
#  Y la ventana sigue siendo de seis horas: el issue mejora QUE TE ENTERES, no
#  CUÁNDO. La caída del 11 de agosto habría seguido durando cinco horas.
# =============================================================================

name: Vigilancia

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Para abrir, comentar y cerrar el issue de aviso, y para poder preguntarle a
# Actions cuándo fue la última copia de seguridad que salió bien. Nada más.
permissions:
  contents: read
  issues: write
  actions: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: doblefoco-app/package-lock.json

      # `pg` hace falta para la consulta de medios mudos. Se instalan las
      # dependencias de la aplicación en vez de declarar otras aparte, para que
      # no haya dos listas que mantener sincronizadas.
      - run: npm ci
        working-directory: doblefoco-app

      # Desde doblefoco-app/ para que `pg` y el registro resuelvan por la vía
      # normal del proyecto: NODE_PATH no sirve, los módulos ESM lo ignoran.
      #
      # `continue-on-error` NO significa que dé igual: el resultado se guarda y
      # el último paso vuelve a fallar el job. Existe para que los pasos del
      # aviso lleguen a correr, porque un fallo aquí los saltaría — que es justo
      # lo que pasaba antes.
      #
      # La salida se guarda además en un fichero para meterla en el issue: un
      # aviso que dice «algo falló, mira los logs» obliga a abrir Actions, y
      # entonces no ha ahorrado nada.
      - name: Sitio, API y medios mudos
        id: comprobacion
        continue-on-error: true
        run: node scripts/comprobarMedios.mjs 2>&1 | tee "$RUNNER_TEMP/vigilancia.txt"
        working-directory: doblefoco-app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── ¿Es POSIBLE lo que el sitio está diciendo? ─────────────────────────
      #
      #  El paso de arriba comprueba que el sitio esté EN PIE. Este comprueba que
      #  lo que sirve no se contradiga a sí mismo, y existe por lo del 2026-08-19:
      #  la rehidratación no leía `articles.topics`, 4 050 historias se quedaron
      #  sin tema teniendo artículos con tema, y el catálogo entero salía marcado
      #  como nacional. Nada chilló — ni las pruebas, ni el lint, ni esta misma
      #  vigilancia, que veía el sitio en pie y con razón.
      #
      #  SALIR CON 2 NO ES UN INVARIANTE ROTO: es que no se pudo mirar, porque la
      #  API no contestó. Se distingue a propósito. Acusar al sitio de
      #  contradecirse cuando lo que pasa es que está caído es la clase de aviso
      #  falso que enseña a ignorar los avisos — y la caída ya la reporta el paso
      #  anterior, que para eso está.
      - name: ¿Se contradice el sitio a sí mismo?
        id: invariantes
        continue-on-error: true
        run: |
          node scripts/invariantes.mjs --strict 2>&1 | tee -a "$RUNNER_TEMP/vigilancia.txt"
          estado=${PIPESTATUS[0]}
          if [ "$estado" = "2" ]; then
            echo "No se pudieron comprobar los invariantes; no se acusa."               | tee -a "$RUNNER_TEMP/vigilancia.txt"
            exit 0
          fi
          exit "$estado"
        working-directory: doblefoco-app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── ¿Y las cosas que fallan por NO ocurrir? ────────────────────────────
      #
      #  Los dos pasos de arriba comprueban algo que corrió y salió mal. Esto
      #  comprueba lo contrario: algo que tenía que correr y no corrió, que es
      #  un fallo sin síntoma —no hay aspa roja, no hay log, no hay nada—.
      #
      #  Existe por lo del 2026-08-31. La copia de seguridad estuvo trece días
      #  en rojo y se descubrió por casualidad; al arreglarla quedó escrito que
      #  el aviso nuevo cubría el fallo pero NO la ausencia: si backup.yml
      #  dejara de ejecutarse, nadie se enteraría. Esto cierra ese hueco, y no
      #  es hipotético — GitHub desactiva solos los flujos programados de un
      #  repositorio sin actividad, y ese es exactamente el caso.
      #
      #  POR QUÉ 36 HORAS, Y POR QUÉ ESE NÚMERO SÍ ESTÁ FUNDADO. Este archivo
      #  tiene escrito que se comprueban contradicciones y no umbrales, porque
      #  un umbral que no respalda nada acaba discutiéndose en vez de leerse.
      #  Aquí el número NO sale del gusto de nadie: sale del cron de backup.yml,
      #  que es diario. Más de 36 h sin una copia buena es el flujo
      #  contradiciendo su propio horario, con doce horas de margen para una
      #  ejecución que se retrase o se encole. Si el cron cambia, este número
      #  cambia con él o deja de significar algo.
      #
      #  Y mide la última que SALIÓ BIEN, no la última que se intentó: trece
      #  intentos fallidos seguidos son trece días sin copia, no actividad.
      - name: ¿Se hizo la copia de seguridad?
        id: copia
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ultima=$(gh run list --workflow=backup.yml --status=success \
                     --limit 1 --json createdAt --jq '.[0].createdAt // empty')

          if [ -z "$ultima" ]; then
            echo "✗ No consta NINGUNA copia de seguridad correcta." \
              | tee -a "$RUNNER_TEMP/vigilancia.txt"
            exit 1
          fi

          horas=$(( ( $(date -u +%s) - $(date -u -d "$ultima" +%s) ) / 3600 ))

          if [ "$horas" -gt 36 ]; then
            echo "✗ La última copia de seguridad correcta fue hace $horas h ($ultima)." \
              | tee -a "$RUNNER_TEMP/vigilancia.txt"
            echo "  El flujo es diario: o está fallando, o ha dejado de ejecutarse." \
              | tee -a "$RUNNER_TEMP/vigilancia.txt"
            exit 1
          fi

          echo "Copia de seguridad: la última correcta fue hace $horas h." \
            | tee -a "$RUNNER_TEMP/vigilancia.txt"

      # ── Aviso ──────────────────────────────────────────────────────────────
      # Se busca por etiqueta y no por título: el título lleva la fecha, así que
      # buscarlo abriría un issue nuevo cada día del mismo incidente.
      - name: Buscar el aviso abierto
        id: abierto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numero=$(gh issue list --label vigilancia --state open \
                     --limit 1 --json number --jq '.[0].number // empty')
          echo "numero=$numero" >> "$GITHUB_OUTPUT"

      - name: Abrir o actualizar el aviso
        if: steps.comprobacion.outcome == 'failure' || steps.invariantes.outcome == 'failure' || steps.copia.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ steps.abierto.outputs.numero }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "La vigilancia falló. Salida completa:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/vigilancia.txt"
            echo '```'
            echo
            echo "[Ver la ejecución completa]($ENLACE)"
          } > "$RUNNER_TEMP/cuerpo.md"

          if [ -n "$NUMERO" ]; then
            # Sigue roto desde la comprobación anterior: se comenta, no se abre
            # otro. Cuatro al día durante un fin de semana serían ocho issues
            # del mismo incidente.
            gh issue comment "$NUMERO" --body-file "$RUNNER_TEMP/cuerpo.md"
          else
            gh issue create \
              --title "Vigilancia en rojo — $(date -u '+%Y-%m-%d %H:%M UTC')" \
              --label vigilancia \
              --body-file "$RUNNER_TEMP/cuerpo.md"
          fi

      - name: Cerrar el aviso si ya se recuperó
        if: steps.comprobacion.outcome == 'success' && steps.invariantes.outcome == 'success' && steps.copia.outcome == 'success' && steps.abierto.outputs.numero != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ steps.abierto.outputs.numero }}
        run: |
          gh issue close "$NUMERO" --comment \
            "Recuperado: la vigilancia volvió a pasar el $(date -u '+%Y-%m-%d %H:%M UTC')."

      # El job tiene que quedar en rojo igual. El issue es el aviso; el aspa
      # sigue siendo el registro, y un job en verde con un issue abierto sería
      # una contradicción que acabaría creyéndose la parte cómoda.
      - name: Reflejar el resultado
        if: steps.comprobacion.outcome == 'failure' || steps.invariantes.outcome == 'failure' || steps.copia.outcome == 'failure'
        run: |
          echo "La comprobación falló; hay un issue abierto con el detalle."
          exit 1
