# Despliegue de DobleFoco en Fly.io: API y motor de ingesta.
#
# UNA APLICACIÓN, DOS GRUPOS DE PROCESO
# -------------------------------------
# `api` y `worker` corren en máquinas separadas pero bajo la misma aplicación.
# Así comparten los secretos —DATABASE_URL se configura una vez— y se despliegan
# juntas, sin dos configuraciones que puedan divergir.
#
# Separadas y no en la misma máquina, porque hacen trabajos opuestos:
#   · el motor carga ~2 400 artículos en memoria para agrupar y trabaja en
#     tandas de minutos;
#   · la API no guarda nada y debe responder siempre.
# Juntarlas haría que un fallo del motor tumbara el sitio, y que reiniciar el
# motor cortara las visitas.
#
# POR QUÉ `gru` (SÃO PAULO)
# -------------------------
# Está medido: la latencia de esta API la dominan los viajes a la base, no el
# cómputo. Una página del feed son 674 ms desde Colombia, de los cuales 280 ms
# son las dos idas y vueltas a Supabase. Con la API al lado de la base —ambas en
# sa-east-1— esas consultas bajan a milisegundos.
# Por eso la API NO va en una función sin servidor de la región por defecto de
# Vercel (costa este de EE. UU.): pagaría ~240 ms en cada petición, para
# siempre, a cambio de ahorrarse una configuración de CORS que ya está escrita y
# probada. Un coste permanente de ejecución no se cambia por comodidad.

app = 'doblefoco'
primary_region = 'gru'

[build]

[processes]
  api = 'node server/index.js'
  worker = 'node scripts/ingestWorker.mjs'

[env]
  PORT = '5000'
  TRUST_PROXY_HOPS = '1'
  # Cada 30 min. Cada feed solo expone sus últimos 15 titulares y un medio
  # activo puede publicar más de 15 en una hora: los que se pierdan no vuelven,
  # y perder artículos sesga la medición de F1-01.
  INGEST_INTERVAL_MS = '1800000'

  # Dominio PÚBLICO del sitio, que no es el de esta API.
  #
  # Lo usan sitemap.xml y robots.txt para declarar URLs canónicas, y las
  # canónicas son las que ve el lector. Si aquí se colara doblefoco.fly.dev,
  # le estaríamos pidiendo a Google que indexe un servidor que devuelve JSON y
  # que lo trate como el sitio real, partiendo la autoridad entre dos dominios.
  # El dominio propio desde el 2026-07-30. De aquí salen el sitemap, las URLs
  # canónicas y el robots.txt, así que si esto se queda con el dominio viejo el
  # sitio nuevo anuncia el anterior y el buscador indexa el que no toca.
  SITE_URL = 'https://doblefoco.co'

  # El JSONL de métricas, a un directorio escribible.
  #
  # /app lo posee root y el proceso corre como `node`, así que cada ciclo
  # fallaba con «EACCES: permission denied, mkdir '/app/data'». No se perdía
  # nada —el registro de ciclos vive en la tabla `ingest_runs` y
  # /api/metrics/daily responde source:postgres—, pero una línea de error cada
  # 30 minutos acaba enseñando a ignorar el registro, y ahí es donde se pierden
  # los errores que sí importan.
  #
  # Es EFÍMERO a propósito, y no se le pone volumen. En un contenedor este
  # archivo no sobrevive a un redespliegue, así que como copia de seguridad no
  # daría más que una falsa sensación de respaldo: la copia real es la base.
  # El JSONL existe para poder correr el motor SIN base de datos.
  DATA_DIR = '/tmp'

[http_service]
  internal_port = 5000
  force_https = true
  # Solo la API recibe tráfico. El motor no escucha en ningún puerto: para
  # pedirle un ciclo, el panel deja una fila en `ingest_requests` y él la mira.
  # Así no tiene superficie de ataque ninguna.
  processes = ['api']

  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # /api/live, NO /api/health.
    #
    # health responde 503 cuando la ingesta está obsoleta: información útil para
    # una persona y veneno como sonda de salud. Al arrancar, `lastRunAt` es null
    # y health daría 503; Fly mataría la máquina y la nueva volvería a dar 503.
    # Bucle de reinicios permanente sobre un servicio que funciona.
    path = '/api/live'
    method = 'GET'
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'

# La API no guarda nada en memoria desde que el feed se lee de la base: arranca
# en 1,65 s y se queda en 74 MB. 256 MB le sobran.
[[vm]]
  processes = ['api']
  size = 'shared-cpu-1x'
  memory = '256mb'

# El motor sí carga el corpus completo para agrupar: ~2 400 artículos con su
# conjunto de tokens cada uno. Quedarse corto lo mataría justo durante el ciclo,
# que es cuando más consume.
[[vm]]
  processes = ['worker']
  size = 'shared-cpu-1x'
  memory = '512mb'
