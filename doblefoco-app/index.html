<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

  <title>DobleFoco.co - Perspectivas Múltiples para Colombia</title>
  <meta name="description"
    content="DobleFoco.co analiza noticias colombianas desde múltiples perspectivas. Combate el sesgo informativo y promueve transparencia mediática con diseño premium e inmersivo." />
  <meta name="theme-color" content="#121212" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DobleFoco.co - Más allá de la noticia" />
  <meta property="og:description"
    content="Explora todas las perspectivas del periodismo colombiano. Análisis instantáneo de polarización de más de 20 fuentes nacionales." />
  <meta property="og:site_name" content="DobleFoco.co" />
  <meta property="og:locale" content="es_CO" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DobleFoco.co - Información Objetiva y Moderna" />
  <meta name="twitter:description"
    content="Descubre cómo los medios cubren cada historia política y decide por ti mismo. Sin sesgos ocultos." />

  <!-- Preconnect & Fonts -->
  <!-- Ya no hay preconnect a images.unsplash.com. Abría una conexión a un
       tercero en CADA carga de página para un banco de fotos de archivo que se
       retiró: las imágenes ahora son las que publica el propio medio, o ninguna. -->

    <!--
      Tipografías servidas desde nuestro propio dominio.

      Antes se enlazaban a fonts.googleapis.com, lo que hacía que el navegador
      de cada lector pidiera los archivos a Google: su IP y el momento exacto de
      la visita, entregados a un tercero en cada carga. Incoherente con la
      página de transparencia, y además más lento por dos handshakes TLS extra.

      Se regeneran con: npm run fonts:fetch
    -->
    <link rel="stylesheet" href="/fonts/fonts.css">

  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
